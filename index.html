
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Camping Live Scoreboard</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 35px 20px;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
}

header {
  text-align: center;
  margin-bottom: 35px;
}

header h1 {
  color: #f5c542;
  font-size: clamp(25px, 5vw, 38px);
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.subtitle {
  color: #aab4c5;
  font-size: 16px;
}

.scoreboard {
  max-width: 850px;
  margin: auto;
}

.team {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #1e293b;
  padding: 20px 24px;
  margin-bottom: 12px;
  border-radius: 10px;
  border: 1px solid #29364b;
  transition: background 0.2s;
}

.team:first-child {
  border: 1px solid #f5c542;
  background: #263348;
}

.team-info {
  display: flex;
  align-items: center;
}

.rank {
  color: #f5c542;
  font-weight: bold;
  font-size: 17px;
  min-width: 40px;
}

.team-name {
  font-size: 17px;
  font-weight: bold;
}

.points {
  font-size: 21px;
  font-weight: bold;
  color: #f5c542;
  white-space: nowrap;
}

.status {
  text-align: center;
  color: #aab4c5;
  margin-top: 25px;
  font-size: 13px;
}

.loading {
  text-align: center;
  color: #aab4c5;
  padding: 35px;
}

.error {
  color: #ff7777;
}

@media (max-width: 600px) {
  body {
    padding: 25px 12px;
  }

  .team {
    padding: 17px 14px;
  }

  .team-name {
    font-size: 15px;
  }

  .points {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<header>
  <h1>CAMPING LIVE SCOREBOARD</h1>
  <div class="subtitle">12 Competing Teams</div>
</header>

<main class="scoreboard" id="scoreboard">
  <div class="loading">Loading scoreboard...</div>
</main>

<div class="status" id="status">
  Connecting to database...
</div>

<script>

// GOOGLE APPS SCRIPT DATABASE URL
const API_URL =
"https://script.google.com/macros/s/AKfycbxwtMebzH1I3C_OLdGZbs04SIzckV3gMe4Ni0S_Bs0QfQrDhXs8GTt2iXInZSqtA-TG/exec";

// LOAD SCORES
function loadScores() {

  const callbackName =
    "scoreCallback_" + Date.now() + "_" +
    Math.random().toString(36).slice(2);

  const script = document.createElement("script");

  let finished = false;

  const timeout = setTimeout(() => {
    if (finished) return;

    finished = true;

    document.getElementById("status").textContent =
      "Connection timed out. Retrying...";

    document.getElementById("status").classList.add("error");

    delete window[callbackName];
    script.remove();

  }, 15000);

  window[callbackName] = function(data) {

    if (finished) return;

    finished = true;
    clearTimeout(timeout);

    if (data && data.success && Array.isArray(data.teams)) {

      displayScores(data.teams);

      const now = new Date().toLocaleTimeString();

      document.getElementById("status").textContent =
        "LIVE • Last updated: " + now;

      document.getElementById("status").classList.remove("error");

    } else {

      document.getElementById("status").textContent =
        "Database error: " +
        (data.error || "Invalid response");

      document.getElementById("status").classList.add("error");

    }

    delete window[callbackName];
    script.remove();
  };

  script.onerror = function() {

    if (finished) return;

    finished = true;
    clearTimeout(timeout);

    document.getElementById("status").textContent =
      "Unable to connect. Retrying...";

    document.getElementById("status").classList.add("error");

    delete window[callbackName];
    script.remove();
  };

  script.src =
    API_URL +
    "?callback=" + callbackName +
    "&t=" + Date.now();

  document.body.appendChild(script);
}

// DISPLAY TEAM RANKINGS
function displayScores(teams) {

  const activeTeams = teams
    .filter(team =>
      String(team.status).trim().toLowerCase() !== "inactive"
    )
    .sort((a, b) => Number(b.score) - Number(a.score));

  const scoreboard = document.getElementById("scoreboard");

  if (activeTeams.length === 0) {
    scoreboard.innerHTML =
      '<div class="loading">No active teams found.</div>';
    return;
  }

  scoreboard.innerHTML = activeTeams.map((team, index) => {

    const name = escapeHTML(team.name || "Unnamed Team");

    const score = Number(team.score) || 0;

    return `
      <div class="team">
        <div class="team-info">
          <span class="rank">#${index + 1}</span>
          <span class="team-name">${name}</span>
        </div>

        <span class="points">
          ${score.toLocaleString()} pts
        </span>
      </div>
    `;

  }).join("");
}

// PREVENT HTML INJECTION
function escapeHTML(value) {

  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);

}

// INITIAL LOAD
loadScores();

// AUTOMATIC REFRESH EVERY 10 SECONDS
setInterval(loadScores, 10000);

</script>

</body>
</html>
